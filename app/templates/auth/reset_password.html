{% extends "base.html" %}

{% block title %}Reset Password - PickleHub{% endblock %}

{% block content %}
<div class="container">
    <div class="glass" style="max-width: 450px; margin: 2rem auto; padding: 2.5rem;">
        <div class="text-center" style="margin-bottom: 2rem;">
            <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 2.5rem; color: white;">
                <i class="fas fa-lock"></i>
            </div>
            <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Reset Password</h1>
            <p style="color: var(--text-secondary);">Create a new password for your account.</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary);">
                    <i class="fas fa-lock"></i> New Password
                </label>
                <input type="password" name="new_password" required
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem;"
                       placeholder="Enter new password (min 8 characters)">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary);">
                    <i class="fas fa-lock"></i> Confirm Password
                </label>
                <input type="password" name="confirm_password" required
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem;"
                       placeholder="Confirm new password">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                <i class="fas fa-check"></i> Reset Password
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
            <p>Remember your password? <a href="{{ url_for('auth.login') }}" style="color: var(--accent); text-decoration: none; font-weight: 600;">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
