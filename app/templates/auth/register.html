{% extends "base.html" %}

{% block title %}Register - PickleHub{% endblock %}

{% block content %}
<div class="container">
    <div class="glass" style="max-width: 500px; margin: 2rem auto; padding: 2.5rem;">
        <div class="text-center" style="margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                <i class="fas fa-jar"></i> PickleHub
            </h1>
            <p style="color: var(--text-secondary);">Create your account and start exploring!</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary);">
                    <i class="fas fa-user"></i> Full Name
                </label>
                <input type="text" name="full_name" required
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem;"
                       placeholder="Enter your full name">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary);">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="email" name="email" required
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem;"
                       placeholder="Enter your email">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary);">
                    <i class="fas fa-phone"></i> Phone (Optional)
                </label>
                <input type="tel" name="phone"
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem;"
                       placeholder="Enter your phone number">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary);">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" name="password" required
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem;"
                       placeholder="Create a password (min 8 characters)">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary);">
                    <i class="fas fa-user-tag"></i> I want to register as
                </label>
                <select name="role" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem;">
                    <option value="customer">Customer</option>
                    <option value="seller">Seller</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--accent); text-decoration: none; font-weight: 600;">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
