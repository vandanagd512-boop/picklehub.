{% extends "base.html" %}

{% block title %}Login - PickleHub{% endblock %}

{% block content %}
<div class="container">
    <div class="glass" style="max-width: 450px; margin: 2rem auto; padding: 2.5rem;">
        <div class="text-center" style="margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                <i class="fas fa-jar"></i> PickleHub
            </h1>
            <p style="color: var(--text-secondary);">Welcome back! Please login to your account.</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary);">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="email" name="email" required
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem;"
                       placeholder="Enter your email">
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary);">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" name="password" required
                       style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-size: 1rem;"
                       placeholder="Enter your password">
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                    <input type="checkbox" style="accent-color: var(--accent);">
                    Remember me
                </label>
                <a href="{{ url_for('auth.forgot_password') }}" style="color: var(--accent); text-decoration: none;">
                    Forgot Password?
                </a>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--accent); text-decoration: none; font-weight: 600;">Register</a></p>
        </div>
        
        <!-- One-Click Demo Logins -->
        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
            <p style="font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); text-align: center; margin-bottom: 1rem;">
                <i class="fas fa-bolt" style="color: #fdcb6e;"></i> One-Click Demo Logins
            </p>
            <div style="display: flex; flex-direction: column; gap: 0.6rem;">
                <button type="button" onclick="quickLogin('customer@picklehub.com', 'customer123')" class="btn btn-secondary" style="width: 100%; justify-content: space-between; font-size: 0.88rem; padding: 0.6rem 1rem;">
                    <span><i class="fas fa-shopping-bag" style="color: var(--accent); margin-right: 0.5rem;"></i> Customer Demo</span>
                    <span style="font-size: 0.75rem; color: var(--text-secondary);">customer@picklehub.com</span>
                </button>
                <button type="button" onclick="quickLogin('seller@picklehub.com', 'seller123')" class="btn btn-secondary" style="width: 100%; justify-content: space-between; font-size: 0.88rem; padding: 0.6rem 1rem;">
                    <span><i class="fas fa-store" style="color: var(--success); margin-right: 0.5rem;"></i> Seller Demo</span>
                    <span style="font-size: 0.75rem; color: var(--text-secondary);">seller@picklehub.com</span>
                </button>
                <button type="button" onclick="quickLogin('admin@picklehub.com', 'admin123')" class="btn btn-secondary" style="width: 100%; justify-content: space-between; font-size: 0.88rem; padding: 0.6rem 1rem;">
                    <span><i class="fas fa-user-shield" style="color: #0984e3; margin-right: 0.5rem;"></i> Admin Demo</span>
                    <span style="font-size: 0.75rem; color: var(--text-secondary);">admin@picklehub.com</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function quickLogin(email, password) {
    document.querySelector('input[name="email"]').value = email;
    document.querySelector('input[name="password"]').value = password;
    document.querySelector('form').submit();
}
</script>
{% endblock %}
